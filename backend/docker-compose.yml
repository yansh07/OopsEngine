version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: oopsengine_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oopsengine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:alpine
    container_name: oopsengine_redis
    ports:
      - "6379:6379"
    restart: always

  api:
    build: .
    container_name: oopsengine_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: always

  worker:
    build: .
    container_name: oopsengine_worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      # THE INTERVIEW FLEX: Mounting the Docker Socket
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

volumes:
  postgres_data: